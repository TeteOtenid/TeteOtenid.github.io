<!DOCTYPE html>
<html>
<head>
  <title>hi!</title>
  <style>
    body {
	  margin: 0;
	  min-height: 100vh;
	}
	.bg {
	  position: fixed;
	  top: 0;
	  left: 0;
	  width: 100%;
	  height: 100%;
	  background-color: white;
	  background-image: radial-gradient(
	    ellipse 100% 80% at 100% 67%, 
		rgba(0,0,0,1), 
		rgba(0,0,0,0.8) 60%,
		transparent 100%
	  );
	  background-repeat: no-repeat;
	  z-index: -1;
	}
    .overlay {
      padding: 40px;
      text-align: center;
	  margin-top: 10%;
    }
    .image1 {
	  position: relative;
	  margin-left: 400px;
	  margin-top:  15%;
    }
	.image1gif {
	  position: relative;
	  transform: scaleX(-1);
	  width: 970px;
	  opacity: 0.1;
	}
	.image1effect {
	  position: absolute;
	  width: 970px;
	  left: 500px;
	  bottom: 4px;
	}
    h1 {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 48px;
      margin: 0;
    }
    p {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay">
    <h1>Hi! Я Тете</h1>
    <p>Скоро здесь будет моё портфолио.</p>
  </div>
  <div class="image1">
    <img class="image1effect" src="bg.jpg" alt="image">
	<img class="image1gif" src="flowers.gif" alt="gif">
  </div>
</body>
</html>
